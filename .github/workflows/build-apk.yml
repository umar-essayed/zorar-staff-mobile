name: Build & Release Zorar Mobile Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android Production Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter --version

      - name: Configure Android Production Keystore
        run: |
          keytool -genkey -v -keystore android/app/zorar-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias zorar -storepass zorarcode2026 -keypass zorarcode2026 \
            -dname "CN=Zorar Code Production, OU=Mobile, O=Zorar Inc, L=Cairo, ST=Cairo, C=EG"
          echo "storePassword=zorarcode2026" > android/key.properties
          echo "keyPassword=zorarcode2026" >> android/key.properties
          echo "keyAlias=zorar" >> android/key.properties
          echo "storeFile=zorar-release.jks" >> android/key.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Signed Release APK (Universal Production)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Signed Android App Bundle (Google Play Store AAB)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Package & Generate Checksums
        run: |
          mkdir -p output_dist
          cp build/app/outputs/flutter-apk/app-release.apk output_dist/zorar-staff-release-signed.apk
          cp build/app/outputs/bundle/release/app-release.aab output_dist/zorar-staff-release-signed.aab
          cd output_dist
          sha256sum * > SHA256SUMS.txt
          echo "Generated Distribution Packages:"
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zorar-mobile-production-suite
          path: output_dist/*
          retention-days: 30

      - name: Create GitHub Production Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zorar Code Mobile Production v1.0.${{ github.run_number }}
          body: |
            ## 🚀 إصدار الإنتاج الرسمي لتطبيق زرار كود المحمول (Production Suite)
            ### رقم الإصدار: v1.0.${{ github.run_number }}
            
            تم بناء الحزم رسمياً وتوقيعها رقمياً (Digitally Signed with RSA 2048-bit Keystore) بكامل الميزات الميدانية:

            ---
            ### 📦 ملفات التثبيت المتاحة:
            1. 📲 **`zorar-staff-release-signed.apk` (نسخة التثبيت المباشر السريعة):**
               - حزمة إنتاج رسمية موثقة وموقعة، جاهزة للتثبيت الفوري على أجهزة الإدارة والمساعدين.
            2. 🏬 **`zorar-staff-release-signed.aab` (حزمة متجر Google Play Store):**
               - حزمة Android App Bundle موجهة للرفع والنشر المباشر على Google Play Console.
            3. 🛡️ **`SHA256SUMS.txt`:**
               - البصمات الرقمية للتحقق من سلامة وصحة الملفات.

            ---
            ### ✨ أبرز مميزات التحديث الميداني:
            - 📡 **طابور تسجيل الحضور أوفلاين (Offline Attendance Queue):** استمرار مسح وتسجيل الطلاب بدون انقطاع حتى مع انقطاع إنترنت السنتر مع مزامنة ذكية وتلقائية فور عودة الشبكة.
            - 🎥 **سجلات المشاهدة والدروس:** متابعة نسبة إنجاز الطالب ومحاضراته المشاهدة مباشرة من شاشة بيانات الطالب.
            - 🔒 **نظام حماية وقفل الخزينة:** تأمين الخزينة وشاشة الكاشير برمز PIN الميداني.
            - 💬 **خدمة إرسال إيصالات الدفع:** إرسال إيصالات الدفع وتنبيهات الغياب لأولياء الأمور مباشرة عبر واتساب.
            - 📊 **تصدير ملخصات الخزينة:** تصدير كشوف حضور وغياب المجموعات.
            - 🎨 **هوية بصرية كاملة:** دعم الوضع الليلي الكامل وتخصيص هوية وألوان السنتر.
          files: output_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
